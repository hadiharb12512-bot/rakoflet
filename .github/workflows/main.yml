name: Build Flet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # تم التحديث لنسخة 3.24.0 لحل مشاكل الـ Parameters في الصور
          flutter-version: '3.24.0'

      - name: Accept Android Licenses
        # هذا السطر يحل مشكلة التراخيص التي ظهرت في الصورة الثالثة
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: |
          # تأكد من وجود ملف requirements.txt يحتوي على flet==0.24.0
          flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/apk/*.apk
