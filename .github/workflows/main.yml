name: Build Flet APK

on:
  push:
    branches:
      - main  # سيتم التشغيل عند الدفع لفرع main، غيره حسب اسم فرعك
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # إصدار متوافق جداً مع Flet 0.24.0

      - name: Build APK
        run: |
          # تأكد من وجود ملف requirements.txt في مشروعك
          flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/apk/*.apk
